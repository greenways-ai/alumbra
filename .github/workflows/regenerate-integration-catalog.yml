name: Regenerate integration catalog

on:
  push:
    branches:
      - agent/material-environment-pipeline

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/build-renderer-catalog.mjs
      - name: Commit generated Catalog
        run: |
          if git diff --quiet -- packages/hodos/generated/renderer-catalog.js; then
            echo "Renderer Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/hodos/generated/renderer-catalog.js
          git commit -m "Regenerate the integrated Renderer Catalog"
          git push origin HEAD:agent/material-environment-pipeline
