name: Generate lighting Showcase Catalog

on:
  push:
    branches:
      - agent/lighting-package-showcases

permissions:
  contents: write

concurrency:
  group: generate-lighting-showcase-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run catalog:build
      - name: Commit generated renderer Catalog
        shell: bash
        run: |
          if git diff --quiet -- packages/hodos/generated/renderer-catalog.js; then
            echo "Renderer Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/hodos/generated/renderer-catalog.js
          git commit -m "Regenerate lighting Showcase Catalog [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
