name: Update history-store workspace lockfile

on:
  push:
    branches:
      - agent/content-addressed-history-store-v2

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-history-store-lock.yml
          git add package-lock.json
          git commit -m "Update the history-store workspace lockfile"
          git push origin HEAD:agent/content-addressed-history-store-v2
