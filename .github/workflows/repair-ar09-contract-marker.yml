name: Repair AR-09 allocation-safety contract marker

on:
  push:
    branches:
      - agent/playcanvas-mesh-light-projection-main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore the exact source-boundary marker
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'packages/renderer-playcanvas/src/prebuilt-renderer.js';
          const source = fs.readFileSync(path, 'utf8');
          const before = '// Resolve and project every group before allocating a mesh, material or entity.';
          const after = '// Resolve every material profile before allocating a mesh, material or entity; project lighting in the same pre-allocation pass.';
          if (!source.includes(before)) throw new Error('Expected AR-09 allocation marker was not found');
          fs.writeFileSync(path, source.replace(before, after));
          NODE
      - name: Commit the repaired source boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-ar09-contract-marker.yml
          git add packages/renderer-playcanvas/src/prebuilt-renderer.js
          git commit -m "Restore the pre-allocation material contract marker"
          git push origin HEAD:agent/playcanvas-mesh-light-projection-main
