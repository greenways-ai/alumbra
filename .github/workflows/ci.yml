name: Alumbra CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check
      - name: Run installed Catalog activities in headless Chromium
        run: npm run check:browser
      - name: Upload Peacock Ballroom review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peacock-ballroom-review-${{ github.sha }}
          path: artifacts/peacock-ballroom/*.png
          if-no-files-found: warn
          retention-days: 14

  hara-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check out the pinned Hara runtime
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: 55644dc578be5da9f815f95c575f126b4dba63ee
          path: .hara-runtime
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .hara-runtime/core/rust -> target
      - name: Build the pinned Hara CLI
        run: cargo build --release --manifest-path .hara-runtime/core/rust/Cargo.toml --bin hara
      - name: Execute the packaged HAL contract suite
        run: .hara-runtime/core/rust/target/release/hara --project packages/hara --no-color --no-splash test
      - name: Prove real-runtime Core digest parity and failure bounds
        env:
          HARA_BIN: ${{ github.workspace }}/.hara-runtime/core/rust/target/release/hara
        run: npm run check:hara-runtime
