name: Apply AR-10 viewport lighting coordinator

on:
  push:
    branches:
      - agent/viewport-lighting-coordinator

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify and materialize AR-10
        run: |
          base64 --decode .github/ar10.bundle.b64 > /tmp/ar10.bundle
          echo "4729de6b7873dba66c0bf65600f7dedef237780c24b37a21ba2ba15839f50a94  /tmp/ar10.bundle" | sha256sum -c -
          tar -xzf /tmp/ar10.bundle -C .
      - name: Validate viewport lighting and repository gates
        run: |
          node --test packages/viewport-playcanvas/test/lighting-coordinator.test.js packages/viewport-playcanvas/test/lit-session.test.js
          npm run check
          npm run pack:check
      - name: Commit AR-10 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/ar10.bundle.b64 .github/workflows/apply-ar10.yml
          git add packages/viewport-playcanvas spec
          git commit -m "Integrate viewport lighting projection and stale-result fencing"
          git push origin HEAD:agent/viewport-lighting-coordinator
