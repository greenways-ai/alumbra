name: Pin lab PlayCanvas runtime

on:
  push:
    branches:
      - agent/world-history-checkpoints

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Pin the browser runtime and remove the CDN dependency
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const manifestPath = 'apps/lab/package.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.dependencies.playcanvas = '2.21.2';
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

          const indexPath = 'apps/lab/index.html';
          const index = fs.readFileSync(indexPath, 'utf8')
            .replace(
              'https://cdn.jsdelivr.net/npm/playcanvas@2.21.3/build/playcanvas/src/index.js',
              '../../node_modules/playcanvas/build/playcanvas/src/index.js',
            );
          fs.writeFileSync(indexPath, index);

          const testPath = 'apps/lab/test/lab-boundary.test.js';
          const test = fs.readFileSync(testPath, 'utf8')
            .replace(
              'assert.match(index, /playcanvas@2\\.21\\.3\\/build\\/playcanvas\\/src\\/index\\.js/);',
              'assert.match(index, /node_modules\\/playcanvas\\/build\\/playcanvas\\/src\\/index\\.js/);',
            )
            .replace(
              'assert.match(index, /@greenways\\/alumbra-viewport-playcanvas/);',
              'assert.equal(JSON.parse(fs.readFileSync(new URL("../package.json", import.meta.url), "utf8")).dependencies.playcanvas, "2.21.2");\n  assert.match(index, /@greenways\\/alumbra-viewport-playcanvas/);',
            );
          fs.writeFileSync(testPath, test);
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the deterministic browser runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/lab/package.json apps/lab/index.html apps/lab/test/lab-boundary.test.js package-lock.json
          if git diff --cached --quiet; then
            echo "PlayCanvas is already pinned locally."
            exit 0
          fi
          git commit -m "Serve the pinned PlayCanvas runtime locally"
          git push origin HEAD:agent/world-history-checkpoints
